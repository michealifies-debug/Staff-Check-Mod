name: Build StaffCheck JAR
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: staffcheck-1.0.0
          path: build/libs/staffcheck-1.0.0.jar
          if-no-files-found: error
